<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Dashboard Kec. Tikala</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0f3d2e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.25);
    }

    .logo-area {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-circle {
      width: 64px;
      height: 64px;
      background: #0f3d2e;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
      font-size: 28px;
    }

    .logo-area h1 {
      font-size: 18px;
      font-weight: 700;
      color: #0f3d2e;
      margin-bottom: 4px;
    }

    .logo-area p {
      font-size: 13px;
      color: #6b7280;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      color: #111827;
      outline: none;
      transition: border-color 0.2s;
      background: #f9fafb;
    }

    input:focus {
      border-color: #0f3d2e;
      background: #fff;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 42px;
    }

    .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #9ca3af;
      font-size: 18px;
      padding: 0;
      line-height: 1;
    }

    .toggle-pw:hover { color: #0f3d2e; }

    .btn-login {
      width: 100%;
      padding: 11px;
      background: #0f3d2e;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-login:hover { background: #1a5c44; }
    .btn-login:active { transform: scale(0.98); }

    .error-msg {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 1rem;
      text-align: center;
    }

    .error-msg.show { display: block; }

    .footer-note {
      text-align: center;
      font-size: 12px;
      color: #9ca3af;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="logo-area">
    <div class="logo-circle">🏛️</div>
    <h1>Dashboard Penduduk A9</h1>
    <p>Kecamatan Tikala · Kota Manado</p>
  </div>

  <div class="error-msg" id="errorMsg">
    Username atau password salah. Silakan coba lagi.
  </div>

  <div class="form-group">
    <label for="username">Username</label>
    <input type="text" id="username" placeholder="Masukkan username" autocomplete="username" />
  </div>

  <div class="form-group">
    <label for="password">Password</label>
    <div class="password-wrap">
      <input type="password" id="password" placeholder="Masukkan password" autocomplete="current-password" />
      <button class="toggle-pw" onclick="togglePassword()" type="button" title="Tampilkan/sembunyikan password">👁</button>
    </div>
  </div>

  <button class="btn-login" onclick="doLogin()">Masuk</button>

  <p class="footer-note">Sistem Informasi Kependudukan · Kec. Tikala 2025</p>
</div>

<script>
  /*
   * ============================================================
   *  AKUN LOGIN
   *  Tambah atau ubah akun di sini sesuai kebutuhan.
   *  Format: "username": "password"
   * ============================================================
   */
  const ACCOUNTS = {
    "admin":      "tikala2025",
    "petugas":    "data1234",
    "kecamatan":  "manado99"
  };

  /* URL dashboard utama setelah login berhasil */
  const DASHBOARD_URL = "index.html";

  /* ---- jangan ubah di bawah ini ---- */

  function doLogin() {
    const user = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value;
    const err  = document.getElementById("errorMsg");

    if (ACCOUNTS[user] && ACCOUNTS[user] === pass) {
      /* Simpan sesi sederhana (hilang saat browser ditutup) */
      sessionStorage.setItem("tikala_auth", btoa(user + ":" + Date.now()));
      window.location.href = DASHBOARD_URL;
    } else {
      err.classList.add("show");
      document.getElementById("password").value = "";
      document.getElementById("password").focus();
    }
  }

  function togglePassword() {
    const inp = document.getElementById("password");
    inp.type = inp.type === "password" ? "text" : "password";
  }

  /* Enter key untuk login */
  document.addEventListener("keydown", function(e) {
    if (e.key === "Enter") doLogin();
  });

  /* Cek apakah sudah login (kembali ke login lagi) */
  if (sessionStorage.getItem("tikala_auth")) {
    window.location.href = DASHBOARD_URL;
  }
</script>

</body>
</html>
